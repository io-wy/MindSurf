stage: sft
output_dir: models/checkpoints/post_training/sft
num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler_type: linear
warmup_steps: 0
eval_strategy: "no"
save_strategy: epoch
save_total_limit: 2
logging_strategy: steps
logging_steps: 10
gradient_checkpointing: false
dataloader_pin_memory: false
bf16: false
fp16: false
max_length: 512
packing: false
report_to: []
resume_from_checkpoint: null
seed: ${seed}
